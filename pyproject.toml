[project]
name = "painterv3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aidocmr", email = "78833301+aidocmr@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "canvasapi>=3.6.0",
    "discord-py>=2.7.1",
